<title>Nuovo Meal Plan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: una colonna da telefono, header fisso in alto, tre schede sotto il pollice. Palette e font sono quelli dell'app attuale. */
:root {
  --bg: #f5f0e8;
  --card: #fffdf8;
  --line: #e0d8c8;
  --ink: #1a1610;
  --muted: #7a7060;
  --accent: #c85a2a;
  --accent-ink: #ffffff;
  --accent-soft: #f6e1d6;
  --green: #3a6b4a;
  --green-soft: #e3ece4;
  --pill: #f0ebe0;
  --shadow: 0 2px 12px rgba(26, 22, 16, .08);
  --display: 'Syne', 'Avenir Next', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0d0a; --card: #1a1610; --line: #2d2820; --ink: #f5f0e8; --muted: #a89e8e;
    --accent: #e07440; --accent-ink: #1a1610; --accent-soft: #3a2216;
    --green: #7fb98f; --green-soft: #1a2a1f; --pill: #2d2820;
    --shadow: 0 4px 16px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0d0a; --card: #1a1610; --line: #2d2820; --ink: #f5f0e8; --muted: #a89e8e;
  --accent: #e07440; --accent-ink: #1a1610; --accent-soft: #3a2216;
  --green: #7fb98f; --green-soft: #1a2a1f; --pill: #2d2820;
  --shadow: 0 4px 16px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.top h1 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -.01em; flex: 1; }
.chip-mock { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px dashed var(--line); border-radius: 99px; padding: 3px 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
.icon-btn:active { background: var(--pill); }

main.wrap { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
.view[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 20px; }

.sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title span { font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 13px; }

/* piano */
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.summary .s { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; color: var(--muted); }
.summary b { color: var(--ink); font-weight: 700; }
.plan-list { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 12px; }
.plan-row .emo { font-size: 26px; text-align: center; }
.plan-row .info { min-width: 0; text-align: left; padding: 4px 0; }
.plan-row .name { font-weight: 600; line-height: 1.25; }
.plan-row .sub { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--pill); border-radius: 99px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1; display: grid; place-items: center; }
.stepper button:active { background: var(--card); }
.stepper output { min-width: 38px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 2px; }
.add-btn { border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px; color: var(--accent); font-weight: 600; text-align: center; }
.empty { text-align: center; color: var(--muted); padding: 20px 8px; border: 1.5px dashed var(--line); border-radius: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.daily { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.daily:last-child { border-bottom: 0; }
.daily .sub { font-size: 13px; color: var(--muted); }

/* spesa */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--pill); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { padding: 10px 6px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.items { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-height: 56px; }
.items > :last-child { border-bottom: 0; }
.item:active { background: var(--pill); }
.item .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.item .txt { min-width: 0; }
.item .nm { font-weight: 600; }
.item .from { font-size: 12.5px; color: var(--muted); }
.item .q { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; text-align: right; }
.item .q small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.tag { font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.tag.buy { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--green-soft); color: var(--green); }
.tag.muted { background: var(--pill); color: var(--muted); }
.item.covered .dot { background: var(--green); border-color: var(--green); color: var(--card); }
.item.covered .nm { color: var(--muted); }
.item.open { background: var(--pill); border-bottom-color: transparent; }
.editor { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 14px 14px 52px; background: var(--pill); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.editor .lbl { font-size: 14px; color: var(--muted); }
.editor .stepper { background: var(--card); }
.item.dsp .dot { border-color: var(--green); color: var(--green); }
.item.dsp.missing .dot { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.item.dsp:not(.missing) .nm { color: var(--muted); font-weight: 500; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.prow .txt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.prow .nm { font-weight: 600; }
.prow .from { font-size: 12.5px; color: var(--muted); }
.prow .stepper output { font-size: 14px; min-width: 74px; }
.prow .stepper button { width: 32px; height: 32px; }
.prow.covered .nm { color: var(--muted); }
.pin { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pin.on { background: var(--green-soft); border-color: transparent; color: var(--green); }
.rep { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); padding: 12px 14px 4px; background: var(--pill); border-bottom: 1px solid var(--line); }
details.rest > summary { list-style: none; cursor: pointer; }
details.rest > summary::-webkit-details-marker { display: none; }
details.rest > summary .sec-title::after { content: "mostra"; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 13px; }
details.rest[open] > summary .sec-title::after { content: "nascondi"; }

.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; }
.progress .big { font-family: var(--display); font-size: 22px; font-weight: 700; }
.progress .lbl { font-size: 14px; color: var(--muted); }
.bar { height: 8px; background: var(--pill); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .2s; }
.shop .item { min-height: 62px; }
.shop .item .nm { font-size: 17px; }
.shop .item.taken .nm, .shop .item.taken .q { color: var(--muted); text-decoration: line-through; }
.shop .item.taken .dot { background: var(--green); border-color: var(--green); color: var(--card); }
.extra-form { display: flex; gap: 8px; }
.extra-form input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.btn { padding: 13px 16px; border-radius: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.block { width: 100%; }

/* ricette */
.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; width: 100%; }
.rec .emo { font-size: 28px; text-align: center; }
.rec .name { font-weight: 600; line-height: 1.25; }
.rec .meta { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--pill); color: var(--muted); white-space: nowrap; }
.pill.in { background: var(--green-soft); color: var(--green); }
.sync { font-size: 13px; color: var(--muted); text-align: center; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-block: 6px; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); position: relative; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--accent); }
.tabbar .badge { position: absolute; top: 2px; left: calc(50% + 8px); background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 6px; min-width: 18px; line-height: 18px; }

/* scheda ricetta */
.sheet-full { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-full .head { position: sticky; top: 0; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); z-index: 2; }
.sheet-full .head .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.sheet-full .head .t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhero { padding-block: 18px 4px; display: flex; flex-direction: column; gap: 10px; }
.rhero .emo { font-size: 40px; line-height: 1; }
.rhero h2 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.rhero .meta { color: var(--muted); font-size: 14px; }
.porz-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.porz-bar .lbl { font-size: 14px; color: var(--muted); }
.porz-bar .lbl b { color: var(--ink); display: block; font-size: 15px; }
.ing { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.ing:last-child { border-bottom: 0; }
.ing .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.ing.done .dot { background: var(--green); border-color: var(--green); }
.ing.done .nm, .ing.done .q { color: var(--muted); text-decoration: line-through; }
.ing .nota { font-size: 12.5px; color: var(--muted); }
.ing .q { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.ing .q small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.opt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-left: 6px; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; text-align: left; width: 100%; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--pill); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.step.cur .n { background: var(--accent); color: var(--accent-ink); }
.step.done { opacity: .5; }
.step.done .n { background: var(--green); color: var(--card); }
.step p { margin: 0; }
.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; display: flex; flex-direction: column; gap: 6px; }
.wake { font-size: 12px; color: var(--green); background: var(--green-soft); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }

/* foglio dal basso */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(15, 13, 10, .45); display: flex; align-items: flex-end; }
.bsheet { width: 100%; max-height: 80%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.bsheet .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 10px; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 6px; }
.bsheet h3 { font-family: var(--display); margin: 0 0 4px; font-size: 20px; }
.menu-item { text-align: left; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); width: 100%; }
.menu-item .sub { display: block; font-size: 13px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <h1 id="title">Ricette</h1>
    <span class="chip-mock">mockup</span>
    <button class="icon-btn" id="menu-btn" aria-label="Menu">⋮</button>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-piano" hidden></section>
  <section class="view" id="v-spesa" hidden></section>
</main>

<nav class="tabbar" aria-label="Schede">
  <div class="wrap">
    <button data-tab="ricette" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      Ricette
    </button>
    <button data-tab="piano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      Piano
    </button>
    <button data-tab="spesa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Spesa<span class="badge" id="spesa-badge" hidden></span>
    </button>
  </div>
</nav>

<div id="overlay"></div>

<script>
// ---- Dati di esempio. Nell'app vera arrivano da ricette.json, generato da Notion. ----
const REPARTI = ['Frutta e verdura', 'Frigo', 'Pane e secchi', 'Scatolame', 'Surgelati', 'Condimenti e spezie', 'Altro'];

// Prodotti che si comprano e si contano in dispensa: reparto, unità, confezione.
const PRODOTTI = {
  'Ceci secchi':               { r: 'Pane e secchi', u: 'g', conf: 500, cn: ['pacco', 'pacchi'] },
  "Burro d'arachidi":          { r: 'Pane e secchi', u: 'g', conf: 350, cn: ['barattolo', 'barattoli'] },

  'Tofu':                      { r: 'Frigo', u: 'g', conf: 180, cn: ['panetto', 'panetti'], show: true },
  'Fagioli neri lessati':      { r: 'Scatolame', u: 'g', conf: 240, cn: ['lattina', 'lattine'] },
  'Riso':                      { r: 'Pane e secchi', u: 'g', conf: 1000, cn: ['pacco', 'pacchi'] },
  'Peperoni':                  { r: 'Frutta e verdura', u: 'g' },
  'Olio':                      { r: 'Condimenti e spezie', u: 'ml', conf: 1000, cn: ['bottiglia', 'bottiglie'] },
  'Olio di semi':              { r: 'Condimenti e spezie', u: 'ml', conf: 1000, cn: ['bottiglia', 'bottiglie'] },
  'Salsa di soia':             { r: 'Condimenti e spezie', u: 'ml', conf: 500, cn: ['bottiglia', 'bottiglie'] },
  'Pasta':                     { r: 'Pane e secchi', u: 'g', conf: 500, cn: ['pacco', 'pacchi'] },
  'Fagioli rossi lessati':     { r: 'Scatolame', u: 'g', conf: 240, cn: ['lattina', 'lattine'] },
  'Lenticchie rosse secche':   { r: 'Pane e secchi', u: 'g', conf: 500, cn: ['pacco', 'pacchi'] },
  'Mais':                      { r: 'Scatolame', u: 'g', conf: 285, cn: ['lattina', 'lattine'] },
  'Verdure per wok surgelate': { r: 'Surgelati', u: 'g', conf: 450, cn: ['busta', 'buste'] },
  'Quinoa':                    { r: 'Pane e secchi', u: 'g', conf: 500, cn: ['pacco', 'pacchi'] },
  'Ceci lessati':              { r: 'Scatolame', u: 'g', conf: 240, cn: ['lattina', 'lattine'] },
  'Patate':                    { r: 'Frutta e verdura', u: 'g', conf: 1500, cn: ['rete', 'reti'] },
  'Lenticchie lessate':        { r: 'Scatolame', u: 'g', conf: 240, cn: ['lattina', 'lattine'] },
  'Frutta':                    { r: 'Frutta e verdura', u: 'pz' },
};
// Cose di casa che non si contano: c'è o manca.
const DISPENSA_REPARTO = { Cipolla: 'Frutta e verdura', Aglio: 'Frutta e verdura', Limone: 'Frutta e verdura' };

// Quantità per 1 porzione. n: true = non si compra (acqua).
const RICETTE = [
  { id: 'mafe', emo: '🥜', nome: "Mafe di ceci al burro d'arachidi", corto: 'Mafe', kcal: 1050, prot: 58, base: 'Altro', tempo: 'pentola a pressione',
    ing: [
      { n: 'Ceci secchi', q: 150, u: 'g', nota: 'in ammollo la sera prima' },
      { n: "Burro d'arachidi", q: 30, u: 'g', nota: 'dopo la pressione' },

// ---- Quantità ----
const PLUR = { cucchiaio: 'cucchiai', cucchiaino: 'cucchiaini', spicchio: 'spicchi', pz: 'pz' };
const nf = v => v.toLocaleString('it-IT', { maximumFractionDigits: 1 });
function frac(x, den) {
  let h = Math.round(x * den) / den;
  const i = Math.floor(h), r = Math.round((h - i) * 4) / 4;
  const sym = { 0: '', .25: '¼', .5: '½', .75: '¾' }[r];
  return { txt: (i || (sym ? '' : '0')) + sym, n: h };
}
function fmt(q, u) {
  if (u === 'q.b.') return 'q.b.';
  if (u === 'g' || u === 'ml') {
    const v = q >= 100 ? Math.round(q / 5) * 5 : Math.round(q);
    if (v >= 1000) return nf(v / 1000) + (u === 'g' ? ' kg' : ' l');
    return v + ' ' + u;
  }
  let h = frac(q, 2); if (h.n === 0) h = frac(.5, 2);
  return h.txt + ' ' + (h.n > 1 ? PLUR[u] : u);
}
const confName = (p, n) => (n === 1 ? p.cn[0] : p.cn[1]);
function fmtStock(name, q) {
  const p = PRODOTTI[name];
  if (q <= 0) return 'niente';
  if (!p.conf) return fmt(q, p.u);
  if (p.conf >= 400) { const h = frac(q / p.conf, 4); return (h.n === 0 ? 'meno di ¼' : h.txt) + ' ' + (h.n > 1 ? p.cn[1] : p.cn[0]); }
  const n = Math.round(q / p.conf * 10) / 10;
  return nf(n) + ' ' + confName(p, n);
}
function stockStep(p) { return p.conf ? (p.conf >= 400 ? p.conf / 4 : p.conf) : (p.u === 'pz' ? 1 : p.u === 'ml' ? 100 : 50); }
function buy(name, need, have) {
  // "Sempre in casa": dopo il piano deve restarne almeno un quarto di confezione.
  const p = PRODOTTI[name], thr = S.min[name] ? (p.conf ? p.conf / 4 : stockStep(p)) : 0;
  let b = need - have;
  if (have - need < thr) b = Math.max(b, thr - (have - need));
  if (b <= 0) return null;
  if (p.conf) { const n = Math.ceil(b / p.conf - 1e-9); return { qty: n * p.conf, txt: n + ' ' + confName(p, n), sub: 'da ' + fmt(p.conf, p.u) }; }
  if (p.u === 'pz') { const n = Math.ceil(b - 1e-9); return { qty: n, txt: n + ' pz', sub: '' }; }
  const v = Math.ceil(b / 50) * 50; return { qty: v, txt: fmt(v, p.u), sub: '' };
}
const recipe = id => RICETTE.find(r => r.id === id);
const inPlan = id => S.plan.find(x => x.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const giorni = () => S.plan.length;

// ---- Fabbisogno: piano × porzioni + ogni giorno × giorni del piano ----
function need() {
  const prod = new Map(), dsp = new Map();
  S.plan.forEach(pl => {
    const r = recipe(pl.id);
    r.ing.forEach(i => {
      if (i.nc || i.f) return;
      if (PRODOTTI[i.n]) {
        if (!prod.has(i.n)) prod.set(i.n, { n: i.n, q: 0, from: [] });
        const e = prod.get(i.n); e.q += i.q * pl.p; if (!e.from.includes(r.corto)) e.from.push(r.corto);
      } else {
        if (!dsp.has(i.n)) dsp.set(i.n, { n: i.n, u: i.u, q: 0 });
        dsp.get(i.n).q += i.q * pl.p;
      }
    });
  });
  DAILY.forEach(d => {
    const q = (S.daily[d.n] || 0) * giorni(); if (!q) return;
    if (!prod.has(d.n)) prod.set(d.n, { n: d.n, q: 0, from: [] });
    const e = prod.get(d.n); e.q += q; e.from.push('ogni giorno');
  });
  Object.keys(S.min).forEach(n => { if (S.min[n] && !prod.has(n)) prod.set(n, { n, q: 0, from: ['sempre in casa'] }); });
  const ord = n => REPARTI.indexOf(PRODOTTI[n] ? PRODOTTI[n].r : (DISPENSA_REPARTO[n] || 'Condimenti e spezie'));
  const sort = (a, b) => ord(a.n) - ord(b.n) || a.n.localeCompare(b.n);
  const list = [...prod.values()].map(e => ({ ...e, have: S.stock[e.n] || 0, buy: buy(e.n, e.q, S.stock[e.n] || 0) })).sort(sort);
  return { prod: list, dsp: [...dsp.values()].sort(sort) };
}
function shopItems() {
  const { prod, dsp } = need(), out = [];
  prod.filter(e => e.buy).forEach(e => out.push({ k: e.n, n: e.n, r: PRODOTTI[e.n].r, txt: e.buy.txt, sub: e.buy.sub, qty: e.buy.qty }));
  dsp.filter(e => S.missing[e.n]).forEach(e => out.push({ k: e.n, n: e.n, r: DISPENSA_REPARTO[e.n] || 'Condimenti e spezie', txt: '', sub: '' }));
  S.extras.forEach(x => out.push({ k: x.k, n: x.n, r: 'Altro', txt: '', sub: '' }));
  return out;
}

let wakeLock = null, openId = null;
async function keepAwake() {

}

}
function renderRecipe() {
  const old = document.querySelector('.sheet-full'), scroll = old ? old.scrollTop : 0;
  const r = recipe(openId), p = inPlan(openId);
  const ck = S.cook[openId] || (S.cook[openId] = { ing: {}, st: {} });
  const porz = p ? p.p : (ck.p || 2);
  const cur = r.proc.findIndex((_, i) => !ck.st[i]);
  const qty = i => {
    const pr = PRODOTTI[i.n], q = i.q * porz;
    return fmt(q, i.u) + (pr && pr.show ? `<small>${nf(Math.round(q / pr.conf * 10) / 10)} ${pr.cn[1]}</small>` : '');
  };
  $('#overlay').innerHTML = `
    <div class="sheet-full" role="dialog" aria-label="${esc(r.nome)}">
      <div class="head"><div class="wrap"><button class="icon-btn" id="back" aria-label="Indietro">←</button><span class="t">${esc(r.nome)}</span><span class="wake" id="wake" ${wakeLock ? '' : 'hidden'}>schermo acceso</span></div></div>
      <div class="wrap" style="display:flex;flex-direction:column;gap:20px">
        <div class="rhero"><span class="emo">${r.emo}</span><h2>${esc(r.nome)}</h2>
          <div class="meta num">${r.kcal} kcal e ${r.prot} g di proteine a porzione · ${esc(r.tempo)}</div></div>
        <div class="porz-bar"><span class="lbl"><b class="num">${nf(porz)} porzioni</b><span class="num">≈ ${Math.round(r.kcal * porz / PASTI / 10) * 10} kcal a pasto</span></span>
          <div class="stepper"><button data-rstep="-0.1" aria-label="Meno">−</button><output>${nf(porz)}</output><button data-rstep="0.1" aria-label="Più">+</button></div></div>
        <div><h2 class="sec-title">Ingredienti</h2>
          <div class="card">${r.ing.map((i, k) => `<button class="ing ${ck.ing[k] ? 'done' : ''}" data-ing="${k}"><span class="dot"></span>
            <span><span class="nm">${esc(i.n)}</span>${i.f ? '<span class="opt">facoltativo</span>' : ''}${i.nota ? `<div class="nota">${esc(i.nota)}</div>` : ''}</span>
            <span class="q">${qty(i)}</span></button>`).join('')}</div></div>
        <div><h2 class="sec-title">Procedimento</h2>
          <div class="steps">${r.proc.map(([t, x], k) => `<button class="step ${ck.st[k] ? 'done' : ''} ${k === cur ? 'cur' : ''}" data-st="${k}"><span class="n">${ck.st[k] ? '✓' : k + 1}</span><p><b>${esc(t)}.</b> ${esc(x)}</p></button>`).join('')}</div></div>
        ${r.note.length ? `<div><h2 class="sec-title">Note</h2><ul class="notes">${r.note.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
        ${p ? '<button class="btn block" id="cooked">Cucinata</button>' : '<button class="btn block" id="toplan">Aggiungi al piano</button><button class="btn ghost block" id="cooked">Cucinata fuori piano</button>'}
      </div>
    </div>`;
  document.querySelector('.sheet-full').scrollTop = scroll;
}
function cook(id, porz) {
  const r = recipe(id);
  r.ing.forEach(i => { if (PRODOTTI[i.n] && !i.f) S.stock[i.n] = Math.max(0, (S.stock[i.n] || 0) - i.q * porz); });
  DAILY.forEach(d => { S.stock[d.n] = Math.max(0, (S.stock[d.n] || 0) - (S.daily[d.n] || 0)); });
  S.plan = S.plan.filter(x => x.id !== id); delete S.cook[id];
}

// ---- Fogli dal basso ----
function sheet(html) {
  const o = document.createElement('div'); o.className = 'scrim';
  o.innerHTML = `<div class="bsheet"><div class="wrap"><div class="grab"></div>${html}</div></div>`;
  o.addEventListener('click', e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o); return o;
}
function addSheet() {
  const avail = RICETTE.filter(r => !inPlan(r.id));
  const o = sheet(`<h3>Aggiungi al piano</h3>${avail.length ? avail.map(r => `<button class="rec" data-add="${r.id}"><span class="emo">${r.emo}</span><span><div class="name">${esc(r.nome)}</div><div class="meta num">${r.kcal} kcal · ${esc(r.tempo)}</div></span><span class="pill">2</span></button>`).join('') : '<div class="empty">Sono già tutte nel piano.</div>'}`);
  o.addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    S.plan.push({ id: b.dataset.add, p: 2 }); save(); o.remove(); render(); toast(recipe(b.dataset.add).corto + ' nel piano');
  });
}
function menuSheet() {
  const o = sheet(`<h3>Menu</h3>
    <button class="menu-item">Backup e import<span class="sub">Nel mockup non fa niente.</span></button>
    <button class="menu-item">Allenamenti</button>
    <button class="menu-item" id="m-reset">Ripristina dati di esempio</button>`);
  o.querySelector('#m-reset').onclick = () => { S = fresh(); save(); o.remove(); render(); toast('Dati di esempio ripristinati'); };
}
let tt;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(tt); tt = setTimeout(() => t.remove(), 2400);
}

// ---- Eventi ----
const round1 = x => Math.round(x * 10) / 10;
function setTab(t) { S.tab = t; S.edit = null; save(); render(); window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + t); } catch (e) {} }
document.querySelector('.tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#menu-btn').onclick = menuSheet;

document.querySelector('main').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.step) { const p = inPlan(d.step); p.p = Math.max(.5, Math.min(6, round1(p.p + +d.d))); save(); render(); return; }
  if (d.daily) { const st = Math.abs(+d.d); S.daily[d.daily] = Math.max(0, (S.daily[d.daily] || 0) + +d.d); save(); render(); return; }
  if (d.open) { openRecipe(d.open); return; }
  if (t.id === 'add-btn') { addSheet(); return; }
  if (d.mode) { S.mode = d.mode; S.edit = null; save(); render(); window.scrollTo(0, 0); return; }
  if (d.pin) { S.min[d.pin] = !S.min[d.pin]; save(); render(); return; }
  if (d.stock) {
    const p = PRODOTTI[d.stock], step = stockStep(p), q = S.stock[d.stock] || 0;
    S.stock[d.stock] = +d.d > 0 ? (Math.floor(q / step + 1e-9) + 1) * step : Math.max(0, (Math.ceil(q / step - 1e-9) - 1) * step);
    save(); render(); return;
  }
  if (d.miss) { S.missing[d.miss] = !S.missing[d.miss]; save(); render(); return; }
  if (d.take) { S.taken[d.take] = !S.taken[d.take]; save(); render(); return; }
  if (t.id === 'done-btn') {
    const list = shopItems(); let n = 0;
    list.forEach(e => { if (S.taken[e.k] && e.qty) { S.stock[e.k] = (S.stock[e.k] || 0) + e.qty; n++; } if (S.taken[e.k] && S.missing[e.k]) delete S.missing[e.k]; });
    S.extras = S.extras.filter(x => !S.taken[x.k]);
    S.taken = {}; S.mode = 'casa'; save(); render(); window.scrollTo(0, 0);
    toast(n + ' prodotti messi in dispensa'); return;
  }
});
document.querySelector('main').addEventListener('submit', e => {
  if (e.target.id !== 'extra-form') return;
  e.preventDefault();
  const v = $('#extra-in').value.trim(); if (!v) return;
  S.extras.push({ n: v, k: 'x|' + v.toLowerCase() + '|' + Date.now() }); save(); render();
  const i = $('#extra-in'); if (i) i.focus();
});
$('#overlay').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, ck = S.cook[openId];
  if (t.id === 'back') { closeRecipe(); render(); return; }
  if (d.rstep) {
    const p = inPlan(openId);
    if (p) p.p = Math.max(.5, Math.min(6, round1(p.p + +d.rstep))); else ck.p = Math.max(.5, Math.min(6, round1((ck.p || 2) + +d.rstep)));
    save(); renderRecipe(); return;
  }
  if (d.ing) { ck.ing[d.ing] = !ck.ing[d.ing]; save(); renderRecipe(); return; }
  if (d.st) { ck.st[d.st] = !ck.st[d.st]; save(); renderRecipe(); return; }
  if (t.id === 'cooked') { const n = recipe(openId).corto, p = inPlan(openId); cook(openId, p ? p.p : (ck.p || 2)); save(); closeRecipe(); render(); toast(n + ' cucinata, dispensa aggiornata'); return; }
  if (t.id === 'toplan') { S.plan.push({ id: openId, p: ck.p || 2 }); save(); renderRecipe(); render(); toast('Aggiunta al piano'); return; }
});
document.addEventListener('visibilitychange', () => { if (openId && document.visibilityState === 'visible' && !wakeLock) keepAwake(); });

const h = location.hash.replace('#', '');
if (TITOLI[h]) S.tab = h;
if (!TITOLI[S.tab]) S.tab = 'ricette';
render();
</script>
