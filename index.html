<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1610">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  /* Schede non sticky, per non sovrapporsi scrollando */
  .tabs { position: static !important; }
</style>
</head>
<body>

<header class="header-riga">
  <h1>🥦 Meal Plan</h1>
  <button class="menu-btn" onclick="apriOverlay('menu')" aria-label="Menu">☰</button>
</header>

<div class="tabs">
  <button class="tab active" data-tab="ricette" onclick="mostraScheda('ricette')">Ricette</button>
  <button class="tab" data-tab="piano" onclick="mostraScheda('piano')">Piano</button>
  <button class="tab" data-tab="spesa" onclick="mostraScheda('spesa')">Spesa</button>
</div>

<div id="avviso-catalogo" class="info-note avviso" hidden></div>

<div id="tab-ricette" class="section active"></div>
<div id="tab-piano" class="section"></div>
<div id="tab-spesa" class="section"></div>

<!-- Scheda ricetta, a tutto schermo -->
<div id="scheda" class="overlay" hidden>
  <div class="overlay-bar">
    <button class="overlay-chiudi" onclick="chiudiOverlay()" aria-label="Indietro">←</button>
    <div class="overlay-titolo" id="scheda-titolo"></div>
  </div>
  <div class="overlay-corpo" id="scheda-corpo"></div>
</div>

<!-- Menu -->
<div id="menu" class="overlay" hidden>
  <div class="overlay-bar">
    <button class="overlay-chiudi" onclick="chiudiOverlay()" aria-label="Indietro">←</button>
    <div class="overlay-titolo">Menu</div>
  </div>
  <div class="overlay-corpo" id="menu-corpo"></div>
</div>

<script src="script.js"></script>
</body>
</html>
