<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d0a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="piano.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 id="titolo">Ricette</h1>
    <button class="icon-btn" data-azione="menu" aria-label="Menu">⋮</button>
  </div>
</header>

<main class="wrap">
  <div id="avviso-catalogo" class="avviso" hidden></div>
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-piano" hidden></section>
  <section class="view" id="v-spesa" hidden></section>
</main>

<nav class="tabbar" aria-label="Schede">
  <div class="wrap">
    <button data-scheda="ricette" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      Ricette
    </button>
    <button data-scheda="piano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      Piano
    </button>
    <button data-scheda="spesa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 11a2 2 0 0 1-2 1.7h-7a2 2 0 0 1-2-1.7L5 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Spesa<span class="badge" id="badge-spesa" hidden></span>
    </button>
  </div>
</nav>

<!-- Pagine a tutto schermo: il tasto indietro del telefono le chiude -->
<div id="scheda" class="sheet-full" role="dialog" hidden>
  <div class="head"><div class="wrap">
    <button class="icon-btn" data-azione="chiudi" aria-label="Indietro">←</button>
    <span class="t" id="scheda-titolo"></span>
    <span class="wake" id="schermo-acceso" hidden>schermo acceso</span>
  </div></div>
  <div class="wrap body ricetta" id="scheda-corpo"></div>
</div>

<div id="backup" class="sheet-full" role="dialog" hidden>
  <div class="head"><div class="wrap">
    <button class="icon-btn" data-azione="chiudi" aria-label="Indietro">←</button>
    <span class="t">Backup</span>
  </div></div>
  <div class="wrap body" id="backup-corpo"></div>
</div>

<div id="extra" class="sheet-full" role="dialog" hidden>
  <div class="head"><div class="wrap">
    <button class="icon-btn" data-azione="chiudi" aria-label="Indietro">←</button>
    <span class="t">Prodotti extra</span>
  </div></div>
  <div class="wrap body" id="extra-corpo"></div>
</div>

<script src="script.js"></script>
</body>
</html>
